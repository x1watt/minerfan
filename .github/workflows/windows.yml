name: Windows build

# Builds the Windows app, which cannot be cross compiled from Linux, and
# attaches it to the release of the tag it was asked for.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload to (for example v0.2.1); empty builds without uploading'
        required: false
      ref:
        description: 'What to build when no tag is given'
        required: false
        default: main

permissions:
  contents: write

jobs:
  build:
    # windows-2022 carries the Visual Studio C++ workload flutter needs.
    runs-on: windows-2022
    steps:
      - name: The tag to build
        id: pick
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then tag="${{ github.ref_name }}"; else tag="${{ github.event.inputs.tag }}"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=${tag:-${{ github.event.inputs.ref || 'main' }}}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pick.outputs.ref }}
          path: minerfan

      # minerfan uses the I2P node from the checkout next to it.
      - uses: actions/checkout@v4
        with:
          repository: x1watt/i2p-dart
          ref: release-0.3.0
          path: i2p-dart

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.1
          channel: stable

      - name: Toolchain
        run: flutter doctor -v

      - name: Build
        working-directory: minerfan/apps/minerfan
        run: |
          flutter config --enable-windows-desktop
          flutter build windows --release

      - name: Pack
        shell: pwsh
        working-directory: minerfan/apps/minerfan
        run: |
          $out = "build/windows/x64/runner/Release"
          Compress-Archive -Path "$out/*" -DestinationPath "$env:GITHUB_WORKSPACE/minerfan-windows-x64.zip"
          (Get-FileHash "$env:GITHUB_WORKSPACE/minerfan-windows-x64.zip" -Algorithm SHA256).Hash.ToLower() `
            + "  minerfan-windows-x64.zip" | Out-File -Encoding ascii "$env:GITHUB_WORKSPACE/minerfan-windows-x64.zip.sha256"

      - name: Attach to the release
        if: steps.pick.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            gh release view "${{ steps.pick.outputs.tag }}" --repo "${{ github.repository }}" > /dev/null 2>&1 && break
            echo "waiting for the release ${{ steps.pick.outputs.tag }}"; sleep 20
          done
          gh release upload "${{ steps.pick.outputs.tag }}" \
            "$GITHUB_WORKSPACE/minerfan-windows-x64.zip" \
            "$GITHUB_WORKSPACE/minerfan-windows-x64.zip.sha256" \
            --repo "${{ github.repository }}" --clobber
