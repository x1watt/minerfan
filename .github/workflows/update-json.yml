name: Publish update.json

# Tells the running apps that a new version is out: hashes the files of a
# release and writes update.json on the project's page (the gh-pages
# branch). Run it after the release has all its files.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (for example v0.2.3)'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: The tag to publish
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then tag="${{ github.event.release.tag_name }}";
          else tag="${{ github.event.inputs.tag }}"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pick.outputs.tag }}
          path: minerfan

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.10.0

      - name: Fetch the files of the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p assets
          gh release download "${{ steps.pick.outputs.tag }}" --repo "${{ github.repository }}" \
            --dir assets --pattern 'minerfan-*' --clobber
          ls -l assets

      - name: Write update.json
        working-directory: minerfan/tool/release
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BASE: https://github.com/${{ github.repository }}/releases/download/${{ steps.pick.outputs.tag }}
          UPDATE_PAGE: https://x1watt.github.io/minerfan/
        run: |
          dart pub get
          gh release view "${{ steps.pick.outputs.tag }}" --repo "${{ github.repository }}" \
            --json body -q .body | head -c 400 > "$GITHUB_WORKSPACE/notes.txt" || true
          dart run make_update_json.dart "${{ steps.pick.outputs.version }}" \
            "$GITHUB_WORKSPACE/assets" "$GITHUB_WORKSPACE/pages/update.json" "$GITHUB_WORKSPACE/notes.txt"
          cat "$GITHUB_WORKSPACE/pages/update.json"

      - name: Put it on the page
        working-directory: pages
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add update.json
          git diff --cached --quiet && echo 'nothing changed' && exit 0
          git commit -m "update.json for ${{ steps.pick.outputs.tag }}"
          git push
