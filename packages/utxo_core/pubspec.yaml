name: utxo_core
description: >-
  Bitcoin-family chains for minerfan: the P2P wire protocol, peers, a header
  light chain from a checkpoint, blocks and transactions, block templates,
  and an SPV HD wallet. Coins plug in through ChainParams; no coin constants
  live here.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  crypto_core:
    path: ../crypto_core
  net_core:
    path: ../net_core
  pow_core:
    path: ../pow_core

dev_dependencies:
  lints: ^6.1.0
  test: ^1.26.3
