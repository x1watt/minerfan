name: xprs_wire
description: >-
  The XPRS packet layer (docs XPRS.md): the wire format, identifiers,
  short-Schnorr signatures, sealed bodies (section 9.2), parts and receipts.
  Vendored from the xprs app and reticulum-dart so minerfan can speak XPRS
  over its own bearers; the xprs repository stays the source.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  crypto: ^3.0.3
  pointycastle: ^3.9.1
  bech32: ^0.2.2
  hex: ^0.2.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.26.3
