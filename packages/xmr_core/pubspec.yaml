name: xmr_core
description: >-
  Pure Dart Monero P2Pool node and RandomX miner: RandomX (light and fast mode),
  Monero primitives, a Monero levin light peer and a P2Pool sidechain node.
  No native code and no runtime dependencies.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  crypto_core:
    path: ../crypto_core
  net_core:
    path: ../net_core

dev_dependencies:
  lints: ^6.1.0
  test: ^1.26.3
